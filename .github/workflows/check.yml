name: MVNO Tracker Bot

on:
  schedule:
    # UTC 기준 (한국 시간 KST는 UTC+9)
    # 매일 한국 시간 오전 9시(00:00 UTC), 오후 6시(09:00 UTC)에 실행
    - cron: '0 0,9 * * *'
  # 원할 때 수동으로 즉시 실행할 수 있는 버튼 활성화
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install requests

      - name: 봇 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
