name: 안드로이드 APK 빌드

# index.html 등 앱 파일이 바뀌면 APK를 새로 만들어 Releases에 올린다.
# 직접 돌리고 싶으면 Actions 탭 > 안드로이드 APK 빌드 > Run workflow
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'MVNO-Man.png'
      - 'app-build/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: mvnobot-android
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 파일 넣고 안드로이드 프로젝트 만들기
        working-directory: app-build
        run: |
          mkdir -p www assets
          cp ../index.html ../manifest.json ../MVNO-Man.png www/
          cp ../MVNO-Man.png assets/icon-only.png
          cp ../MVNO-Man.png assets/icon-foreground.png
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: 앱 아이콘 만들기
        working-directory: app-build
        continue-on-error: true
        run: npx -y @capacitor/assets generate --android --iconBackgroundColor '#4f46e5' --iconBackgroundColorDark '#4f46e5'

      - name: 버전 번호 올리기 (업데이트 설치가 되도록)
        working-directory: app-build/android
        run: |
          GRADLE=app/build.gradle
          [ -f "$GRADLE" ] || GRADLE=app/build.gradle.kts
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode ${VERSION_CODE}/; s/versionName[ =]+\"[^\"]*\"/versionName \"1.0.${VERSION_CODE}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: APK 빌드
        working-directory: app-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 서명 (항상 같은 키로 서명해야 덮어쓰기 설치가 됨)
        working-directory: app-build/android
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks ../release.keystore --ks-pass "pass:$KS_PASS" --ks-key-alias mvno --key-pass "pass:$KS_PASS" \
            --out "$GITHUB_WORKSPACE/mvno-bot.apk" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/mvno-bot.apk" | head -3

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-1.0.${VERSION_CODE}" mvno-bot.apk \
            --title "알뜰폰 앱 1.0.${VERSION_CODE}" \
            --notes "갤럭시에서 mvno-bot.apk를 받아 설치하세요. 이미 설치돼 있으면 그대로 덮어쓰기(업데이트)됩니다." \
            --latest
