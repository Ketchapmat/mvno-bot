<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알뜰폰 회선 매니저</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-16">

  <!-- 헤더 -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-base font-bold flex items-center gap-2">
        <i class="fa-solid fa-sim-card"></i> 알뜰폰 회선 매니저
      </h1>
      <div class="flex gap-1.5">
        <button onclick="openApiKeyModal()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-2.5 py-1.5 rounded-lg">
          <i class="fa-solid fa-key"></i> API
        </button>
        <button onclick="openJsonModal()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-2.5 py-1.5 rounded-lg">
          <i class="fa-solid fa-database"></i> 백업
        </button>
        <button onclick="openModal()" class="text-xs bg-white text-indigo-700 font-bold px-2.5 py-1.5 rounded-lg shadow">
          <i class="fa-solid fa-plus"></i> 추가
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- AI 자동등록 버튼 그룹 (스크린샷 / 말로 등록) -->
    <div class="grid grid-cols-2 gap-2">
      <!-- 1. 스크린샷 캡처 등록 -->
      <label class="cursor-pointer bg-gradient-to-r from-indigo-500 to-indigo-600 rounded-2xl p-3.5 text-white shadow-sm flex flex-col justify-between hover:opacity-95 transition">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-camera text-amber-300"></i> AI 캡처 분석</span>
          <i class="fa-solid fa-chevron-right text-[10px] text-indigo-200"></i>
        </div>
        <p class="text-[10px] text-indigo-100">고객센터 화면 업로드</p>
        <input type="file" id="ai-screenshot-input" accept="image/*" class="hidden" onchange="processScreenshot(event)">
      </label>

      <!-- 2. 말로/자연어 텍스트 등록 -->
      <button onclick="openVoiceModal()" class="text-left bg-gradient-to-r from-purple-500 to-purple-600 rounded-2xl p-3.5 text-white shadow-sm flex flex-col justify-between hover:opacity-95 transition">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-microphone text-amber-300"></i> AI 말로 등록</span>
          <i class="fa-solid fa-chevron-right text-[10px] text-purple-200"></i>
        </div>
        <p class="text-[10px] text-purple-100">자연어로 대충 말/작성</p>
      </button>
    </div>

    <!-- 상단 상태 요약 바 -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center">
        <p class="text-[11px] font-bold text-amber-700 flex items-center justify-center gap-1">
          <i class="fa-regular fa-clock"></i> 30일 이내 만료
        </p>
        <p id="count-30" class="text-xl font-extrabold text-amber-800 mt-0.5">0건</p>
      </div>
      <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 text-center">
        <p class="text-[11px] font-bold text-rose-700 flex items-center justify-center gap-1">
          <i class="fa-solid fa-triangle-exclamation"></i> 7일 이내 초임박
        </p>
        <p id="count-7" class="text-xl font-extrabold text-rose-800 mt-0.5">0건</p>
      </div>
    </div>

    <!-- 회선 목록 컨테이너 -->
    <div id="lines-container" class="space-y-6"></div>

  </main>

  <!-- AI 분석 로딩 오버레이 -->
  <div id="loading-overlay" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center text-white space-y-3">
    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-400"></i>
    <p id="loading-msg" class="text-sm font-bold">AI가 정보를 분석 중입니다...</p>
    <p class="text-xs text-slate-300">개통일, 기간, 요금제 정보를 추출합니다.</p>
  </div>

  <!-- AI 말로/자연어 입력 모달 -->
  <div id="voice-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles text-purple-600"></i> AI 말로 / 자연어 등록
        </h3>
        <button onclick="closeVoiceModal()" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-[11px] text-slate-500">
        스마트폰 키보드의 <b>마이크 버튼(🎤)</b>을 누르고 말하거나, 생각나는 대로 자유롭게 적어주세요.
      </p>
      <textarea id="voice-text-input" class="w-full h-28 text-xs border rounded-xl p-3 bg-slate-50 outline-none focus:ring-2 focus:ring-purple-500" placeholder="예시: 우민준 메인 회선 010-1234-5678 프리티 KT망 15기가 무제한 0원에 4월 15일 6개월 개통했어"></textarea>
      <div class="flex gap-2 pt-1">
        <button onclick="processVoiceText()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow">
          <i class="fa-solid fa-robot"></i> AI로 내용 자동 완성하기
        </button>
      </div>
    </div>
  </div>

  <!-- API Key 설정 모달 -->
  <div id="api-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">Gemini API 키 설정</h3>
        <button onclick="closeApiKeyModal()" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-[11px] text-slate-500">Google AI Studio에서 발급받은 무료 API Key를 입력하세요.</p>
      <input type="password" id="gemini-api-key-input" placeholder="AIzaSy..." class="w-full border rounded-lg p-2.5 text-xs font-mono outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex gap-2 pt-2">
        <button onclick="saveApiKey()" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-indigo-700">저장</button>
      </div>
    </div>
  </div>

  <!-- 회선 추가/수정 모달 -->
  <div id="edit-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-title" class="font-bold text-slate-800">회선 정보 설정</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- 타겟 슬롯 선택 -->
      <div id="slot-selector-box" class="bg-indigo-50 p-2.5 rounded-xl border border-indigo-100">
        <label class="block font-bold text-indigo-900 text-[11px] mb-1">적용 대상 회선</label>
        <select id="form-target-slot" onchange="onSlotChange()" class="w-full border border-indigo-200 rounded-lg p-1.5 text-xs bg-white text-indigo-950 font-medium"></select>
      </div>

      <form id="line-form" onsubmit="saveLine(event)" class="space-y-3 text-xs">
        <input type="hidden" id="line-id">

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-600 mb-1">명의자</label>
            <input type="text" id="form-owner" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="우민준 또는 박소연">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">구분</label>
            <select id="form-type" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="USIM">USIM</option>
              <option value="eSIM">eSIM</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-600 mb-1">회선 별칭</label>
            <input type="text" id="form-name" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="예: 1. main usi">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">전화번호 (자동매칭용)</label>
            <input type="tel" id="form-phone" maxlength="13" oninput="formatPhoneInput(this)" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="010-0000-0000">
          </div>
        </div>

        <!-- 통신사명 직접입력 + 통신망 선택 드롭다운 -->
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block font-medium text-slate-600 mb-1">알뜰폰 통신사</label>
            <input type="text" id="form-carrier-name" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="예: 프리티, 모비링, 이지모바일">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">통신망</label>
            <select id="form-carrier-net" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium">
              <option value="KT망">KT</option>
              <option value="SKT망">SKT</option>
              <option value="LGU+망">LGU+</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block font-medium text-slate-600 mb-1">데이터</label>
            <input type="text" id="form-data" required class="w-full border rounded-lg p-2" placeholder="15GB+1M">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">통화</label>
            <input type="text" id="form-call" required class="w-full border rounded-lg p-2" placeholder="무제한">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">문자</label>
            <input type="text" id="form-sms" required class="w-full border rounded-lg p-2" placeholder="100건">
          </div>
        </div>

        <!-- 날짜 및 할인기간 -->
        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-700 mb-1">개통일 (가입일)</label>
              <input type="date" id="form-start-date" required onchange="calcEndDate()" class="w-full border rounded-lg p-1.5 bg-white">
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">할인 기간</label>
              <select id="form-duration" onchange="calcEndDate()" class="w-full border rounded-lg p-1.5 bg-white font-medium">
                <option value="1">1개월</option>
                <option value="3">3개월</option>
                <option value="4">4개월</option>
                <option value="5">5개월</option>
                <option value="6" selected>6개월</option>
                <option value="7">7개월</option>
                <option value="8">8개월</option>
                <option value="9">9개월</option>
                <option value="10">10개월</option>
                <option value="12">12개월 (1년)</option>
                <option value="24">24개월 (2년)</option>
                <option value="custom">직접입력</option>
              </select>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="font-bold text-indigo-700 text-[11px]">⚡ 할인 종료일 (자동 계산)</label>
              <span id="calc-hint" class="text-[10px] text-emerald-600 font-bold"></span>
            </div>
            <input type="date" id="form-end-date" required class="w-full border rounded-lg p-1.5 bg-indigo-50/50 font-bold text-indigo-900">
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-600 mb-1">현재 할인 요금</label>
          <input type="text" id="form-fee" required class="w-full border rounded-lg p-2" placeholder="0원 또는 1,100원">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="deleteLine()" id="btn-delete" class="w-1/3 bg-slate-200 text-slate-700 py-2.5 rounded-lg font-bold hidden">삭제</button>
          <button type="submit" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg font-bold hover:bg-indigo-700">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JSON 백업 모달 -->
  <div id="json-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">데이터 백업 및 복원</h3>
        <button onclick="closeJsonModal()" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <textarea id="json-input" class="w-full h-44 text-xs font-mono border rounded-lg p-2 bg-slate-50 outline-none"></textarea>
      <div class="flex gap-2 pt-1">
        <button onclick="copyJsonData()" class="w-1/2 bg-slate-100 border text-slate-700 py-2 rounded-lg text-xs font-bold">코드 복사</button>
        <button onclick="applyJsonData()" class="w-1/2 bg-indigo-600 text-white py-2 rounded-lg text-xs font-bold">데이터 적용</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'MVNO_LINES_DATA';
    const API_KEY_STORAGE = 'MVNO_GEMINI_API_KEY';

    const defaultData = [
      { id: 1, owner: '우민준', name: '1. main usi', phone: '010-0000-0001', type: 'USIM', carrier: '프리티 (KT망)', data: '15GB+1Mbps', call: '무제한', sms: '100건', startDate: '2026-04-15', duration: '6', endDate: '2026-10-15', fee: '0원' },
      { id: 2, owner: '우민준', name: '1-2. main e-sim', phone: '010-0000-0002', type: 'eSIM', carrier: '모비링 (SKT망)', data: '500MB', call: '무제한', sms: '무제한', startDate: '2026-07-20', duration: '6', endDate: '2027-01-20', fee: '1,100원' },
      { id: 3, owner: '우민준', name: '2. navi', phone: '010-0000-0003', type: 'USIM', carrier: '이지모바일 (LGU+망)', data: '7GB+1Mbps', call: '100분', sms: '100건', startDate: '2026-02-01', duration: '7', endDate: '2026-08-31', fee: '2,200원' },
      { id: 4, owner: '박소연', name: '3. main', phone: '010-0000-0004', type: 'USIM', carrier: '에르엘 (SKT망)', data: '11GB+일2GB+3M', call: '무제한', sms: '기본제공', startDate: '2026-01-10', duration: '7', endDate: '2026-08-28', fee: '0원' },
      { id: 5, owner: '박소연', name: '4. MSJ', phone: '010-0000-0005', type: 'USIM', carrier: '스노우맨 (KT망)', data: '1.5GB', call: '50분', sms: '50건', startDate: '2026-05-10', duration: '6', endDate: '2026-11-10', fee: '0원' }
    ];

    function parseCarrier(str) {
      if (!str) return { name: '', net: 'KT망' };
      let net = 'KT망';
      if (str.includes('SKT') || str.includes('skt') || str.includes('SK')) {
        net = 'SKT망';
      } else if (str.includes('LG') || str.includes('lg') || str.includes('U+') || str.includes('u+')) {
        net = 'LGU+망';
      } else if (str.includes('KT') || str.includes('kt')) {
        net = 'KT망';
      }
      let name = str.replace(/\(?(SKT망|KT망|LGU\+망|LG U\+망|SKT|KT|LGU\+|LG|skt|kt|lgu\+)\)?/gi, '').trim();
      return { name, net };
    }

    function formatPhoneInput(target) {
      let val = target.value.replace(/[^0-9]/g, '');
      let res = '';
      if (val.length < 4) {
        res = val;
      } else if (val.length < 7) {
        res = val.substr(0, 3) + '-' + val.substr(3);
      } else if (val.length < 11) {
        res = val.substr(0, 3) + '-' + val.substr(3, 3) + '-' + val.substr(6);
      } else {
        res = val.substr(0, 3) + '-' + val.substr(3, 4) + '-' + val.substr(7, 4);
      }
      target.value = res;
    }

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : defaultData;
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      render();
    }

    function calcEndDate() {
      const startDateStr = document.getElementById('form-start-date').value;
      const durationVal = document.getElementById('form-duration').value;

      if (!startDateStr || durationVal === 'custom') return;

      const months = parseInt(durationVal);
      const start = new Date(startDateStr);
      start.setMonth(start.getMonth() + months);

      const yyyy = start.getFullYear();
      const mm = String(start.getMonth() + 1).padStart(2, '0');
      const dd = String(start.getDate()).padStart(2, '0');
      const calculatedDate = `${yyyy}-${mm}-${dd}`;

      document.getElementById('form-end-date').value = calculatedDate;
      document.getElementById('calc-hint').innerText = `(${months}개월 자동계산됨)`;
    }

    function getDiffDays(targetDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(targetDateStr);
      target.setHours(0, 0, 0, 0);
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function getElapsedDays(startDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const start = new Date(startDateStr);
      start.setHours(0, 0, 0, 0);
      return Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
    }

    function render() {
      const lines = loadData();
      const container = document.getElementById('lines-container');
      container.innerHTML = '';

      let count30 = 0;
      let count7 = 0;

      const groups = {};
      lines.forEach(item => {
        const owner = item.owner || '미지정';
        if (!groups[owner]) groups[owner] = [];
        groups[owner].push(item);
      });

      for (const [owner, items] of Object.entries(groups)) {
        const section = document.createElement('section');
        section.className = 'space-y-3';
        section.innerHTML = `
          <div class="flex items-center gap-2 px-1">
            <span class="w-2.5 h-2.5 rounded-full ${owner.includes('우민준') ? 'bg-indigo-600' : 'bg-pink-500'}"></span>
            <h2 class="font-bold text-slate-700 text-sm">명의자: ${owner} (${items.length}회선)</h2>
          </div>
        `;

        items.forEach(line => {
          const dDay = getDiffDays(line.endDate);
          const elapsed = getElapsedDays(line.startDate);
          const portReady = elapsed >= 90;
          const portRemain = 90 - elapsed;

          if (dDay <= 30 && dDay >= 0) count30++;
          if (dDay <= 7 && dDay >= 0) count7++;

          let cardBorder = 'border-slate-200';
          let ddayBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">D-${dDay}</span>`;

          if (dDay < 0) {
            cardBorder = 'border-slate-400 bg-slate-50';
            ddayBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-slate-200 text-slate-600">만료됨</span>`;
          } else if (dDay <= 7) {
            cardBorder = 'border-2 border-rose-400 bg-rose-50/30';
            ddayBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-600 text-white animate-pulse">D-${dDay} 초임박</span>`;
          } else if (dDay <= 30) {
            cardBorder = 'border-2 border-amber-300 bg-amber-50/20';
            ddayBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">D-${dDay} 임박</span>`;
          }

          const card = document.createElement('div');
          card.className = `bg-white rounded-2xl p-4 shadow-sm border ${cardBorder} relative`;
          card.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${line.type === 'USIM' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${line.type}</span>
                <span class="text-xs text-slate-500 ml-1">${line.carrier}</span>
                <div class="flex items-center gap-1.5 mt-0.5">
                  <h3 class="text-sm font-bold text-slate-900">${line.name}</h3>
                  ${line.phone ? `<span class="text-[10px] text-slate-400 font-mono">(${line.phone})</span>` : ''}
                </div>
              </div>
              <div class="text-right">
                ${ddayBadge}
                <p class="text-[10px] text-slate-400 mt-1 font-medium"><i class="fa-regular fa-calendar-xmark"></i> ${line.endDate} 마감</p>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-1 bg-slate-50 rounded-lg p-2 text-center text-xs mb-3">
              <div><span class="text-slate-400 block text-[10px]">데이터</span><b>${line.data}</b></div>
              <div><span class="text-slate-400 block text-[10px]">통화</span><b>${line.call}</b></div>
              <div><span class="text-slate-400 block text-[10px]">문자</span><b>${line.sms}</b></div>
            </div>

            <div class="space-y-1.5 text-xs text-slate-600">
              <div class="flex justify-between">
                <span>개통일자 (${line.duration ? line.duration + '개월' : ''})</span>
                <span class="font-medium text-slate-800">${line.startDate} (${elapsed}일차)</span>
              </div>
              <div class="flex justify-between items-center">
                <span>번호이동 가능 여부</span>
                ${portReady 
                  ? '<span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">🟢 즉시 이동 가능 (90일 경과)</span>' 
                  : `<span class="text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded">🟡 이동 제한 (D-${portRemain}일 후 가능)</span>`
                }
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                <span>현재 할인 요금</span>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-indigo-600 text-sm">${line.fee}</span>
                  <button onclick="editLine(${line.id})" class="text-slate-300 hover:text-slate-600 p-0.5">
                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
          section.appendChild(card);
        });
        container.appendChild(section);
      }

      document.getElementById('count-30').innerText = `${count30}건`;
      document.getElementById('count-7').innerText = `${count7}건`;
    }

    function openModal(id = null, prefillData = null) {
      const modal = document.getElementById('edit-modal');
      const form = document.getElementById('line-form');
      form.reset();
      document.getElementById('calc-hint').innerText = '';

      const lines = loadData();
      const slotSelect = document.getElementById('form-target-slot');
      slotSelect.innerHTML = '<option value="new">+ 새 회선으로 추가하기</option>';
      lines.forEach(l => {
        slotSelect.innerHTML += `<option value="${l.id}">기존 [${l.owner}] ${l.name} (${l.phone || '번호없음'}) 덮어쓰기</option>`;
      });

      if (id) {
        slotSelect.value = id;
        const item = lines.find(l => l.id === id);
        if (item) populateForm(item);
        document.getElementById('modal-title').innerText = '회선 정보 수정';
        document.getElementById('btn-delete').classList.remove('hidden');
      } else if (prefillData) {
        let matchedId = 'new';
        if (prefillData.phone) {
          const matched = lines.find(l => l.phone && l.phone.replace(/[^0-9]/g, '').includes(prefillData.phone.replace(/[^0-9]/g, '')));
          if (matched) matchedId = matched.id;
        }
        slotSelect.value = matchedId;
        populateForm(prefillData);
        document.getElementById('modal-title').innerText = 'AI 분석 결과 확인';
        document.getElementById('btn-delete').classList.add('hidden');
      } else {
        slotSelect.value = 'new';
        document.getElementById('line-id').value = '';
        document.getElementById('modal-title').innerText = '새 회선 추가';
        document.getElementById('btn-delete').classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function populateForm(data) {
      document.getElementById('line-id').value = data.id || '';
      if (data.owner) document.getElementById('form-owner').value = data.owner;
      if (data.type) document.getElementById('form-type').value = data.type;
      if (data.name) document.getElementById('form-name').value = data.name;
      
      const phoneInput = document.getElementById('form-phone');
      if (data.phone) {
        phoneInput.value = data.phone;
        formatPhoneInput(phoneInput);
      } else {
        phoneInput.value = '';
      }

      if (data.carrier) {
        const parsed = parseCarrier(data.carrier);
        document.getElementById('form-carrier-name').value = parsed.name;
        document.getElementById('form-carrier-net').value = parsed.net;
      } else {
        document.getElementById('form-carrier-name').value = '';
        document.getElementById('form-carrier-net').value = 'KT망';
      }

      if (data.data) document.getElementById('form-data').value = data.data;
      if (data.call) document.getElementById('form-call').value = data.call;
      if (data.sms) document.getElementById('form-sms').value = data.sms;
      if (data.startDate) document.getElementById('form-start-date').value = data.startDate;
      if (data.duration) document.getElementById('form-duration').value = data.duration;
      if (data.endDate) document.getElementById('form-end-date').value = data.endDate;
      if (data.fee) document.getElementById('form-fee').value = data.fee;

      if (data.startDate && data.duration) calcEndDate();
    }

    function onSlotChange() {
      const selectedSlot = document.getElementById('form-target-slot').value;
      if (selectedSlot !== 'new') {
        const lines = loadData();
        const item = lines.find(l => l.id === parseInt(selectedSlot));
        if (item) {
          document.getElementById('line-id').value = item.id;
          document.getElementById('form-owner').value = item.owner;
          document.getElementById('form-name').value = item.name;
          if (item.phone) {
            const phoneInput = document.getElementById('form-phone');
            phoneInput.value = item.phone;
            formatPhoneInput(phoneInput);
          }
          const parsed = parseCarrier(item.carrier);
          document.getElementById('form-carrier-name').value = parsed.name;
          document.getElementById('form-carrier-net').value = parsed.net;
        }
      } else {
        document.getElementById('line-id').value = '';
      }
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function saveLine(e) {
      e.preventDefault();
      const lines = loadData();
      const slotVal = document.getElementById('form-target-slot').value;
      const targetId = (slotVal !== 'new') ? parseInt(slotVal) : (document.getElementById('line-id').value ? parseInt(document.getElementById('line-id').value) : Date.now());

      const carrierName = document.getElementById('form-carrier-name').value.trim();
      const carrierNet = document.getElementById('form-carrier-net').value;
      const combinedCarrier = carrierName ? `${carrierName} (${carrierNet})` : carrierNet;

      const lineObj = {
        id: targetId,
        owner: document.getElementById('form-owner').value,
        type: document.getElementById('form-type').value,
        name: document.getElementById('form-name').value,
        phone: document.getElementById('form-phone').value,
        carrier: combinedCarrier,
        data: document.getElementById('form-data').value,
        call: document.getElementById('form-call').value,
        sms: document.getElementById('form-sms').value,
        startDate: document.getElementById('form-start-date').value,
        duration: document.getElementById('form-duration').value,
        endDate: document.getElementById('form-end-date').value,
        fee: document.getElementById('form-fee').value
      };

      const idx = lines.findIndex(l => l.id === targetId);
      if (idx !== -1) {
        lines[idx] = lineObj;
      } else {
        lines.push(lineObj);
      }

      saveData(lines);
      closeModal();
    }

    function deleteLine() {
      const idVal = document.getElementById('line-id').value;
      if (idVal && confirm('이 회선을 삭제하시겠습니까?')) {
        let lines = loadData();
        lines = lines.filter(l => l.id !== parseInt(idVal));
        saveData(lines);
        closeModal();
      }
    }

    function editLine(id) {
      openModal(id);
    }

    function openVoiceModal() {
      document.getElementById('voice-text-input').value = '';
      document.getElementById('voice-modal').classList.remove('hidden');
    }

    function closeVoiceModal() {
      document.getElementById('voice-modal').classList.add('hidden');
    }

    async function processVoiceText() {
      const text = document.getElementById('voice-text-input').value.trim();
      if (!text) {
        alert('내용을 입력하거나 마이크로 말해주세요.');
        return;
      }

      const apiKey = localStorage.getItem(API_KEY_STORAGE);
      if (!apiKey) {
        alert('먼저 상단의 [🔑 API] 버튼을 눌러 Gemini API 키를 등록해 주세요.');
        openApiKeyModal();
        return;
      }

      closeVoiceModal();
      document.getElementById('loading-msg').innerText = '자연어 내용을 분석 중입니다...';
      document.getElementById('loading-overlay').classList.remove('hidden');

      try {
        const promptText = `
사용자가 구어체로 말하거나 자유롭게 작성한 알뜰폰 개통/가입 정보입니다.
아래 문장에서 회선 정보를 추출하여 반드시 정해진 JSON 형식으로만 응답하세요.
모르는 항목은 빈 문자열("")로 채우세요.
날짜는 반드시 YYYY-MM-DD 형식이어야 합니다.
할인 기간(개월) 숫자를 추출해주세요 (예: 6개월 할인이면 "6").

[사용자 입력 내용]
"${text}"

JSON 출력 포맷:
{
  "owner": "명의자 성함 (있으면)",
  "phone": "전화번호 (예: 010-1234-5678)",
  "type": "USIM 또는 eSIM",
  "name": "회선 별칭 (예: 1. main, 네비용 등)",
  "carrier": "통신사명 및 망 (예: 프리티 KT망, 모비링 SKT망)",
  "data": "데이터 제공량 (예: 15GB+1Mbps, 500MB)",
  "call": "통화량 (예: 무제한, 100분)",
  "sms": "문자량 (예: 100건, 무제한)",
  "startDate": "개통일 (YYYY-MM-DD)",
  "duration": "할인개월수 (숫자만, 예: 6)",
  "endDate": "할인종료일 (YYYY-MM-DD)",
  "fee": "할인 요금 (예: 0원, 1,100원)"
}
`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const result = await response.json();
        if (result.error) throw new Error(result.error.message);

        const parsedJson = JSON.parse(result.candidates[0].content.parts[0].text);
        openModal(null, parsedJson);

      } catch (err) {
        alert('분석 중 오류가 발생했습니다: ' + err.message);
      } finally {
        document.getElementById('loading-overlay').classList.add('hidden');
      }
    }

    async function processScreenshot(event) {
      const file = event.target.files[0];
      if (!file) return;

      const apiKey = localStorage.getItem(API_KEY_STORAGE);
      if (!apiKey) {
        alert('먼저 상단의 [🔑 API] 버튼을 눌러 발급받은 Gemini API 키를 등록해 주세요.');
        openApiKeyModal();
        event.target.value = '';
        return;
      }

      document.getElementById('loading-msg').innerText = '스크린샷 이미지를 분석 중입니다...';
      document.getElementById('loading-overlay').classList.remove('hidden');

      try {
        const base64Data = await fileToBase64(file);
        const promptText = `
이 스크린샷은 알뜰폰 요금제 또는 가입 내역 화면입니다.
아래 JSON 형식에 맞춰 필요한 정보를 추출해주세요.
알 수 없는 항목은 빈 문자열로 두세요.
날짜는 반드시 YYYY-MM-DD 형식이어야 합니다.
할인 기간(개월) 숫자를 추출해주세요 (예: 6개월 할인이면 6).

JSON 출력 포맷:
{
  "owner": "명의자 성함 (있으면)",
  "phone": "전화번호 (예: 010-1234-5678)",
  "type": "USIM 또는 eSIM",
  "name": "회선 별칭",
  "carrier": "통신사명 및 망 (예: 프리티 KT망)",
  "data": "데이터 제공량 (예: 15GB+1Mbps)",
  "call": "통화량 (예: 무제한)",
  "sms": "문자량 (예: 100건)",
  "startDate": "개통일 (YYYY-MM-DD)",
  "duration": "할인개월수 (숫자만, 예: 6)",
  "endDate": "할인종료일 (YYYY-MM-DD, 명시되어 있다면)",
  "fee": "할인 요금 (예: 0원 또는 1,100원)"
}
`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inline_data: {
                    mime_type: file.type || 'image/png',
                    data: base64Data.split(',')[1]
                  }
                }
              ]
            }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const result = await response.json();
        if (result.error) throw new Error(result.error.message);

        const parsedJson = JSON.parse(result.candidates[0].content.parts[0].text);
        openModal(null, parsedJson);

      } catch (err) {
        alert('분석 중 오류가 발생했습니다: ' + err.message);
      } finally {
        document.getElementById('loading-overlay').classList.add('hidden');
        event.target.value = '';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function openApiKeyModal() {
      document.getElementById('gemini-api-key-input').value = localStorage.getItem(API_KEY_STORAGE) || '';
      document.getElementById('api-modal').classList.remove('hidden');
    }

    function closeApiKeyModal() {
      document.getElementById('api-modal').classList.add('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-api-key-input').value.trim();
      if (key) {
        localStorage.setItem(API_KEY_STORAGE, key);
        alert('Gemini API 키가 저장되었습니다.');
        closeApiKeyModal();
      } else {
        localStorage.removeItem(API_KEY_STORAGE);
        alert('API 키가 삭제되었습니다.');
      }
    }

    function openJsonModal() {
      document.getElementById('json-input').value = JSON.stringify(loadData(), null, 2);
      document.getElementById('json-modal').classList.remove('hidden');
    }

    function closeJsonModal() {
      document.getElementById('json-modal').classList.add('hidden');
    }

    function copyJsonData() {
      const copyText = document.getElementById('json-input');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('데이터가 클립보드에 복사되었습니다.');
    }

    function applyJsonData() {
      try {
        const parsed = JSON.parse(document.getElementById('json-input').value);
        if (Array.isArray(parsed)) {
          saveData(parsed);
          closeJsonModal();
          alert('성공적으로 적용되었습니다.');
        } else {
          alert('데이터 형식이 올바르지 않습니다.');
        }
      } catch (err) {
        alert('JSON 형식이 잘못되었습니다.');
      }
    }

    render();
  </script>
</body>
</html>
