  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    
    .line-card {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-y;
      transform-origin: center center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition:
        box-shadow 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.18s ease,
        opacity 0.16s ease;
    }

    /*
      실제 휴대폰 터치 전용 드래그.
      SortableJS의 네이티브/폴백 드래그를 쓰지 않고
      화면 위에 카드 복제본을 직접 띄워 손가락을 따라 이동시킨다.
    */
    .drag-lifted-card {
      position: fixed !important;
      margin: 0 !important;
      pointer-events: none !important;
      z-index: 999999 !important;
      transform-origin: center center !important;
      background: #ffffff !important;
      border: 1.5px solid rgba(99, 102, 241, 0.72) !important;
      border-radius: 1.5rem !important;
      box-shadow:
        0 24px 48px rgba(15, 23, 42, 0.22),
        0 8px 18px rgba(15, 23, 42, 0.10) !important;
      will-change: transform;
      transition:
        box-shadow 0.16s ease,
        border-color 0.16s ease !important;
    }

    /* 원래 카드가 있던 자리 */
    .drag-placeholder-card {
      opacity: 0.16 !important;
      background: #eef2f7 !important;
      border: 1.5px dashed #94a3b8 !important;
      box-shadow: none !important;
    }

    .drag-placeholder-card > * {
      visibility: hidden !important;
    }

    body.is-card-dragging {
      user-select: none !important;
      -webkit-user-select: none !important;
      overscroll-behavior: none;
      cursor: grabbing !important;
    }

    body.is-card-dragging * {
      -webkit-touch-callout: none !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24 select-none antialiased">

  <!-- 헤더 -->

    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-base font-extrabold tracking-tight flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-white/10 flex items-center justify-center border border-white/20">
          <i class="fa-solid fa-sim-card text-indigo-200 text-xs"></i>
        </div>
        알뜰폰 회선 매니저
      </h1>
      <div class="flex gap-1.5">
        <button onclick="openApiKeyModal()" class="text-xs bg-white/10 hover:bg-white/20 border border-white/15 px-2.5 py-1.5 rounded-xl font-medium transition backdrop-blur-sm">

        <button onclick="openJsonModal()" class="text-xs bg-white/10 hover:bg-white/20 border border-white/15 px-2.5 py-1.5 rounded-xl font-medium transition backdrop-blur-sm">

        <button onclick="openModal()" class="text-xs bg-white text-indigo-700 font-bold px-3 py-1.5 rounded-xl shadow-md hover:bg-indigo-50 transition active:scale-95">

        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- AI 자동등록 버튼 그룹 -->

      <!-- 1. AI 캡처 분석 -->

            <span class="w-5 h-5 rounded-md bg-white/20 flex items-center justify-center text-[10px]">
              <i class="fa-solid fa-camera text-amber-300"></i>
            </span>

          </span>
          <i class="fa-solid fa-arrow-right text-[10px] text-indigo-200"></i>
        </div>

          <span class="text-xs font-bold flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-md bg-white/20 flex items-center justify-center text-[10px]">
              <i class="fa-solid fa-microphone text-amber-300"></i>
            </span>
            AI 말로 등록
          </span>
          <i class="fa-solid fa-arrow-right text-[10px] text-purple-200"></i>
        </div>
        <p class="text-[10px] text-purple-100 font-normal">음성/자연어로 편하게 입력</p>
      </button>
    </div>

    <!-- 상단 상태 요약 바 -->
    <div class="grid grid-cols-2 gap-3">
      <!-- 30일 이내 만료 버튼 -->
      <button id="btn-filter-30" onclick="toggleFilter('30')" class="text-left rounded-3xl p-4 shadow-sm hover:shadow-md transition active:scale-[0.98] relative overflow-hidden group border border-amber-200/80 bg-gradient-to-br from-[#FFF9ED] via-[#FFF3E2] to-[#FFE8CC]">

        </div>
        <p id="count-30" class="relative text-[34px] leading-none font-black text-[#C56A00] mt-2">0건</p>

      </button>

      <!-- 7일 이내 만료 버튼 -->
      <button id="btn-filter-7" onclick="toggleFilter('7')" class="text-left rounded-3xl p-4 shadow-sm hover:shadow-md transition active:scale-[0.98] relative overflow-hidden group border border-rose-200/85 bg-gradient-to-br from-[#FFF6F8] via-[#FFECEF] to-[#FFDDE6]">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(255,255,255,0.9),transparent_44%)] pointer-events-none"></div>
        <div class="relative flex justify-between items-center">
          <p class="text-[11px] font-extrabold text-rose-950 flex items-center gap-1.5 tracking-tight">
            <span id="dot-7-container">
              <span id="dot-7" class="w-2 h-2 rounded-full bg-slate-300 inline-block"></span>
            </span>
            7일 이내 만료
          </p>
          <i class="fa-solid fa-angle-right text-xs text-rose-500 group-hover:translate-x-0.5 transition"></i>

      <button onclick="resetFilter()" class="bg-indigo-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg hover:bg-indigo-700">전체보기 ✕</button>
    </div>

    <!-- 회선 목록 컨테이너 -->
    <div id="lines-container" class="space-y-6"></div>

  <!-- AI 분석 로딩 오버레이 -->

  <!-- AI 말로/자연어 입력 모달 -->
  <div id="voice-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-3.5 shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <span class="w-6 h-6 rounded-lg bg-purple-100 text-purple-700 flex items-center justify-center text-xs">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </span>

        </h3>

      <p class="text-[11px] text-slate-500 leading-relaxed">
        스마트폰 키보드의 <b>마이크 버튼(🎤)</b>을 눌러 말하거나, 생각나는 대로 자유롭게 적어주시면 AI가 자동으로 정리해 드립니다.
      </p>
      <textarea id="voice-text-input" class="w-full h-28 text-xs border border-slate-200 rounded-2xl p-3 bg-slate-50 outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition" placeholder="예시: 우민준 메인 회선 01012345678 프리티 KT망 15기가 무제한 0원에 4월 15일 6개월 개통"></textarea>
      <div class="flex gap-2 pt-1">
        <button onclick="processVoiceText()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-md hover:opacity-95 transition active:scale-98">
          <i class="fa-solid fa-bolt"></i> AI로 내용 자동 완성하기
        </button>
      </div>
    </div>
  </div>

  <!-- API Key 설정 모달 -->
  <div id="api-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-3.5 shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <span class="w-6 h-6 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs">
            <i class="fa-solid fa-key"></i>
          </span>

        </h3>
        <button onclick="closeApiKeyModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>

  <!-- 회선 추가/수정 모달 -->
  <div id="edit-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto space-y-3.5 shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 id="modal-title" class="font-bold text-slate-800">회선 정보 설정</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- 타겟 슬롯 선택 -->
      <div id="slot-selector-box" class="bg-indigo-50/70 p-2.5 rounded-2xl border border-indigo-100">
        <label class="block font-bold text-indigo-950 text-[11px] mb-1">적용 대상 회선</label>
        <select id="form-target-slot" onchange="onSlotChange()" class="w-full border border-indigo-200 rounded-xl p-1.5 text-xs bg-white text-indigo-950 font-medium"></select>
      </div>

      <form id="line-form" onsubmit="saveLine(event)" class="space-y-3 text-xs">
        <input type="hidden" id="line-id">

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-600 mb-1">명의자</label>
            <input type="text" id="form-owner" required class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="우민준 또는 박소연">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">구분</label>
            <select id="form-type" class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="USIM">USIM</option>
              <option value="eSIM">eSIM</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-600 mb-1">회선 별칭</label>
            <input type="text" id="form-name" required class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="예: 1. main usi">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">전화번호 (자동매칭용)</label>
            <input type="tel" id="form-phone" maxlength="13" oninput="formatPhoneInput(this)" class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="010-0000-0000">
          </div>
        </div>

        <!-- 통신사명 직접입력 + 통신망 선택 드롭다운 -->
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block font-medium text-slate-600 mb-1">알뜰폰 통신사</label>
            <input type="text" id="form-carrier-name" required class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="예: 프리티, 모비링, 이지모바일">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">통신망</label>
            <select id="form-carrier-net" class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium">
              <option value="KT망">KT</option>
              <option value="SKT망">SKT</option>
              <option value="LGU+망">LGU+</option>
            </select>
          </div>
        </div>

        <!-- 데이터/통화/문자 -->
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block font-medium text-slate-600 mb-1">데이터</label>
            <input type="text" id="form-data" required onblur="formatDataInput(this)" class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="15 -> 15GB">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">통화</label>
            <input type="text" id="form-call" required onblur="formatCallInput(this)" class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="100 -> 100분">
          </div>
          <div>
            <label class="block font-medium text-slate-600 mb-1">문자</label>
            <input type="text" id="form-sms" required onblur="formatSmsInput(this)" class="w-full border border-slate-200 rounded-xl p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="100 -> 100건">
          </div>
        </div>

        <!-- 날짜 및 할인기간 -->

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-700 mb-1">개통일 (가입일)</label>
              <input type="date" id="form-start-date" required onchange="calcEndDate()" class="w-full border border-slate-200 rounded-xl p-1.5 bg-white">
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">할인 기간</label>
              <select id="form-duration" onchange="calcEndDate()" class="w-full border border-slate-200 rounded-xl p-1.5 bg-white font-medium">
                <option value="1">1개월</option>
                <option value="3">3개월</option>
                <option value="4">4개월</option>
                <option value="5">5개월</option>
                <option value="6" selected>6개월</option>
                <option value="7">7개월</option>
                <option value="8">8개월</option>
                <option value="9">9개월</option>
                <option value="10">10개월</option>
                <option value="12">12개월 (1년)</option>
                <option value="24">24개월 (2년)</option>
                <option value="custom">직접입력</option>
              </select>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="font-bold text-indigo-700 text-[11px]">⚡ 할인 종료일 (자동 계산)</label>
              <span id="calc-hint" class="text-[10px] text-emerald-600 font-bold"></span>
            </div>
            <input type="date" id="form-end-date" required class="w-full border border-indigo-200 rounded-xl p-1.5 bg-indigo-50/40 font-bold text-indigo-900">
          </div>
        </div>

        <!-- 할인 요금 입력란 -->
        <div>
          <label class="block font-medium text-slate-600 mb-1">현재 할인 요금</label>
          <div class="relative">
            <input type="text" id="form-fee" inputmode="numeric" oninput="formatFeeClean(this)" class="w-full border border-slate-200 rounded-xl p-2 pr-9 font-bold text-indigo-600 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="0">
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">원</span>
          </div>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="deleteLine()" id="btn-delete" class="w-1/3 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hidden hover:bg-slate-300 transition">삭제</button>
          <button type="submit" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 데이터 백업/이메일/파일 모달 -->
  <div id="json-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <span class="w-6 h-6 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center text-xs">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </span>
          데이터 백업 및 이메일 전송
        </h3>

  <script>
    const STORAGE_KEY = 'MVNO_LINES_DATA';
    const API_KEY_STORAGE = 'MVNO_GEMINI_API_KEY';

    let currentFilter = 'all';

    const defaultData = [
      { id: 1, owner: '우민준', name: '1. main usi', phone: '010-0000-0001', type: 'USIM', carrier: '프리티 (KT망)', data: '15GB+1Mbps', call: '무제한', sms: '100건', startDate: '2026-04-15', duration: '6', endDate: '2026-10-15', fee: '0원' },
      { id: 2, owner: '우민준', name: '1-2. main e-sim', phone: '010-0000-0002', type: 'eSIM', carrier: '모비링 (SKT망)', data: '500MB', call: '무제한', sms: '무제한', startDate: '2026-07-20', duration: '6', endDate: '2027-01-20', fee: '1,100원' },
      { id: 3, owner: '우민준', name: '2. navi', phone: '010-0000-0003', type: 'USIM', carrier: '이지모바일 (LGU+망)', data: '7GB+1Mbps', call: '100분', sms: '100건', startDate: '2026-02-01', duration: '7', endDate: '2026-08-31', fee: '2,200원' },
      { id: 4, owner: '박소연', name: '3. main', phone: '010-0000-0004', type: 'USIM', carrier: '에르엘 (SKT망)', data: '11GB+일2GB+3M', call: '무제한', sms: '기본제공', startDate: '2026-01-10', duration: '7', endDate: '2026-08-28', fee: '0원' },
      { id: 5, owner: '박소연', name: '4. MSJ', phone: '010-0000-0005', type: 'USIM', carrier: '스노우맨 (KT망)', data: '1.5GB', call: '50분', sms: '50건', startDate: '2026-05-10', duration: '6', endDate: '2026-11-10', fee: '0원' }
    ];

    function formatDataInput(el) {
      let val = el.value.trim();
      if (/^\d+(\.\d+)?$/.test(val)) {
        el.value = val + 'GB';
      }
    }

    function formatCallInput(el) {
      let val = el.value.trim();
      if (/^\d+$/.test(val)) {
        el.value = val + '분';
      }
    }

    function formatSmsInput(el) {
      let val = el.value.trim();
      if (/^\d+$/.test(val)) {
        el.value = val + '건';
      }
    }

    function formatFeeClean(el) {
      let val = el.value.replace(/[^0-9]/g, '');
      if (val === '') {
        el.value = '';
        return;
      }
      el.value = Number(val).toLocaleString('ko-KR');
    }

    function formatPhoneInput(target) {
      let val = target.value.replace(/[^0-9]/g, '');
      let res = '';
      if (val.length < 4) {
        res = val;
      } else if (val.length < 7) {
        res = val.substr(0, 3) + '-' + val.substr(3);
      } else if (val.length < 11) {
        res = val.substr(0, 3) + '-' + val.substr(3, 3) + '-' + val.substr(6);
      } else {
        res = val.substr(0, 3) + '-' + val.substr(3, 4) + '-' + val.substr(7, 4);
      }
      target.value = res;
    }

    function parseCarrier(str) {
      if (!str) return { name: '', net: 'KT망' };
      let net = 'KT망';
      if (str.includes('SKT') || str.includes('skt') || str.includes('SK')) {
        net = 'SKT망';
      } else if (str.includes('LG') || str.includes('lg') || str.includes('U+') || str.includes('u+')) {
        net = 'LGU+망';
      } else if (str.includes('KT') || str.includes('kt')) {
        net = 'KT망';
      }
      let name = str.replace(/\(?(SKT망|KT망|LGU\+망|LG U\+망|SKT|KT|LGU\+|LG|skt|kt|lgu\+)\)?/gi, '').trim();
      return { name, net };
    }

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : defaultData;
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      render();
    }

    function calcEndDate() {
      const startDateStr = document.getElementById('form-start-date').value;
      const durationVal = document.getElementById('form-duration').value;

      if (!startDateStr || durationVal === 'custom') return;

      const months = parseInt(durationVal);
      const start = new Date(startDateStr);
      start.setMonth(start.getMonth() + months);

      const yyyy = start.getFullYear();
      const mm = String(start.getMonth() + 1).padStart(2, '0');
      const dd = String(start.getDate()).padStart(2, '0');
      const calculatedDate = `${yyyy}-${mm}-${dd}`;

      document.getElementById('form-end-date').value = calculatedDate;
      document.getElementById('calc-hint').innerText = `(${months}개월 자동계산됨)`;
    }

    function getDiffDays(targetDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(targetDateStr);
      target.setHours(0, 0, 0, 0);
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function getElapsedDays(startDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const start = new Date(startDateStr);
      start.setHours(0, 0, 0, 0);
      return Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
    }

    function toggleFilter(type) {
      if (currentFilter === type) {
        currentFilter = 'all';
      } else {
        currentFilter = type;
      }
      render();
    }

    function resetFilter() {
      currentFilter = 'all';
      render();
    }

    function render() {
      const allLines = loadData();
      const container = document.getElementById('lines-container');
      container.innerHTML = '';

      let count30 = 0;
      let count7 = 0;

      allLines.forEach(line => {
        const dDay = getDiffDays(line.endDate);
        if (dDay <= 30 && dDay >= 0) count30++;
        if (dDay <= 7 && dDay >= 0) count7++;
      });

      document.getElementById('count-30').innerText = `${count30}건`;
      document.getElementById('count-7').innerText = `${count7}건`;

      const dot30 = document.getElementById('dot-30');
      if (count30 > 0) {
        dot30.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shadow-[0_0_0_4px_rgba(251,191,36,0.18)]';
      } else {
        dot30.className = 'w-2 h-2 rounded-full bg-slate-300';
      }

      const dot7Container = document.getElementById('dot-7-container');
      if (count7 > 0) {
        dot7Container.innerHTML = `
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-60"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500 shadow-[0_0_0_4px_rgba(244,63,94,0.14)]"></span>
          </span>
        `;
      } else {
        dot7Container.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-300 inline-block"></span>`;
      }

      const ind30 = document.getElementById('filter-indicator-30');
      const ind7 = document.getElementById('filter-indicator-7');
      const resetBar = document.getElementById('filter-reset-bar');
      const statusText = document.getElementById('filter-status-text');

      if (currentFilter === '30') {
        ind30.classList.remove('hidden');
        ind7.classList.add('hidden');
        resetBar.classList.remove('hidden');
        statusText.innerText = '⚡ [30일 이내 만료] 회선만 보는 중';
      } else if (currentFilter === '7') {
        ind30.classList.add('hidden');
        ind7.classList.remove('hidden');
        resetBar.classList.remove('hidden');
        statusText.innerText = '🚨 [7일 이내 만료] 회선만 보는 중';
      } else {
        ind30.classList.add('hidden');
        ind7.classList.add('hidden');
        resetBar.classList.add('hidden');
      }

      let filteredLines = allLines;
      if (currentFilter === '30') {
        filteredLines = allLines.filter(line => {
          const d = getDiffDays(line.endDate);
          return d <= 30 && d >= 0;
        });
      } else if (currentFilter === '7') {
        filteredLines = allLines.filter(line => {
          const d = getDiffDays(line.endDate);
          return d <= 7 && d >= 0;
        });
      }

      if (filteredLines.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl p-8 text-center text-slate-400 border border-slate-100 shadow-sm space-y-2">
            <i class="fa-solid fa-shield-cat text-3xl text-slate-300"></i>
            <p class="text-xs font-medium">해당하는 만료 예정 회선이 없습니다.</p>
          </div>
        `;
        return;
      }

      const groups = {};
      filteredLines.forEach(item => {
        const owner = item.owner || '미지정';
        if (!groups[owner]) groups[owner] = [];
        groups[owner].push(item);
      });

      for (const [owner, items] of Object.entries(groups)) {
        const section = document.createElement('section');
        section.className = 'space-y-3';
        section.innerHTML = `
          <div class="flex items-center justify-between px-1">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full ${owner.includes('우민준') ? 'bg-indigo-600 shadow-sm shadow-indigo-200' : 'bg-pink-500 shadow-sm shadow-pink-200'}"></span>
              <h2 class="font-extrabold text-slate-700 text-sm tracking-tight">명의자: ${owner} (${items.length}회선)</h2>
            </div>
            <span class="text-[10px] text-slate-400 font-medium"><i class="fa-solid fa-arrows-up-down mr-1"></i>꾹 눌러 순서 변경</span>
          </div>
        `;

        const cardsContainer = document.createElement('div');
        cardsContainer.className = 'space-y-3 sortable-group';
        cardsContainer.dataset.owner = owner;

        items.forEach(line => {
          const dDay = getDiffDays(line.endDate);
          const elapsed = getElapsedDays(line.startDate);
          const portReady = elapsed >= 90;
          const portRemain = 90 - elapsed;

          let cardBorder = 'border-slate-200/90';
          let ddayBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">D-${dDay}</span>`;

          if (dDay < 0) {
            cardBorder = 'border-slate-300 bg-slate-50/70';
            ddayBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-slate-200 text-slate-600">만료됨</span>`;
          } else if (dDay <= 7) {
            cardBorder = 'border-2 border-rose-400 bg-rose-50/30';
            ddayBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-600 text-white animate-pulse shadow-sm shadow-rose-200">D-${dDay} 초임박</span>`;
          } else if (dDay <= 30) {
            cardBorder = 'border-2 border-amber-300 bg-amber-50/20';
            ddayBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-200">D-${dDay} 임박</span>`;
          }

          const card = document.createElement('div');
          card.dataset.id = line.id;
          card.className = `line-card bg-white rounded-3xl p-4 shadow-sm border ${cardBorder} relative cursor-grab`;
          card.innerHTML = `
            <div class="flex justify-between items-start mb-2.5">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-lg ${line.type === 'USIM' ? 'bg-indigo-50 text-indigo-700 border border-indigo-100' : 'bg-purple-50 text-purple-700 border border-purple-100'}">${line.type}</span>
                  <span class="text-xs font-semibold text-slate-500">${line.carrier}</span>
                </div>
                <div class="flex items-center gap-1.5 mt-1.5">
                  <h3 class="text-sm font-extrabold text-slate-900 tracking-tight">${line.name}</h3>
                  ${line.phone ? `<span class="text-[11px] text-slate-400 font-mono">(${line.phone})</span>` : ''}
                </div>
              </div>
              <div class="text-right">
                ${ddayBadge}
                <p class="text-[10px] text-slate-400 mt-1 font-medium"><i class="fa-regular fa-calendar-xmark"></i> ${line.endDate} 마감</p>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-1.5 bg-slate-50/90 rounded-2xl p-2.5 text-center text-xs mb-3 border border-slate-100">
              <div><span class="text-slate-400 block text-[10px] mb-0.5">데이터</span><b class="text-slate-800 font-bold">${line.data}</b></div>
              <div><span class="text-slate-400 block text-[10px] mb-0.5">통화</span><b class="text-slate-800 font-bold">${line.call}</b></div>
              <div><span class="text-slate-400 block text-[10px] mb-0.5">문자</span><b class="text-slate-800 font-bold">${line.sms}</b></div>
            </div>

            <div class="space-y-1.5 text-xs text-slate-600">
              <div class="flex justify-between items-center">
                <span class="text-slate-500">개통일자 (${line.duration ? line.duration + '개월' : ''})</span>
                <span class="font-semibold text-slate-800">${line.startDate} (${elapsed}일차)</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-slate-500">번호이동 가능 여부</span>
                ${portReady 
                  ? '<span class="text-[10px] font-extrabold text-emerald-600 bg-emerald-50 border border-emerald-100 px-2 py-0.5 rounded-lg">🟢 즉시 이동 가능 (90일 경과)</span>' 
                  : `<span class="text-[10px] font-extrabold text-amber-700 bg-amber-50 border border-amber-100 px-2 py-0.5 rounded-lg">🟡 이동 제한 (D-${portRemain}일 후)</span>`
                }
              </div>
              <div class="flex justify-between items-center pt-2.5 border-t border-slate-100">
                <span class="text-slate-500">현재 할인 요금</span>
                <div class="flex items-center gap-2">
                  <span class="font-extrabold text-indigo-600 text-sm">${line.fee}</span>
                  <button onclick="editLine(${line.id})" class="text-slate-400 hover:text-indigo-600 bg-slate-100 hover:bg-indigo-50 p-1.5 rounded-lg transition">
                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
          cardsContainer.appendChild(card);
        });

        section.appendChild(cardsContainer);
        container.appendChild(section);
      }

      initSortable();
    }

    // ------------------------------------------------------------
    // 휴대폰 전용 iPhone 스타일 롱프레스 드래그 엔진
    // - SortableJS 사용 안 함
    // - 230ms 롱프레스
    // - 카드 절대 회전 없음
    // - 복제 카드를 화면 위에 띄워 손가락을 정확히 따라가게 함
    // ------------------------------------------------------------
    const dragEngine = {
      bound: false,
      card: null,
      clone: null,
      timer: null,
      dragging: false,
      inputType: null,
      touchId: null,
      startX: 0,
      startY: 0,
      currentX: 0,
      currentY: 0,
      startRect: null,
      raf: null,
      suppressClickUntil: 0
    };

    function initSortable() {
      if (dragEngine.bound) return;
      dragEngine.bound = true;

      const root = document.getElementById('lines-container');

      root.addEventListener('touchstart', handleDragTouchStart, { passive: true });
      document.addEventListener('touchmove', handleDragTouchMove, { passive: false });
      document.addEventListener('touchend', handleDragTouchEnd, { passive: false });
      document.addEventListener('touchcancel', handleDragTouchEnd, { passive: false });

      root.addEventListener('mousedown', handleDragMouseDown);
      document.addEventListener('mousemove', handleDragMouseMove);
      document.addEventListener('mouseup', handleDragMouseUp);

      // 드래그 직후 손가락을 뗐을 때 내부 수정버튼 등이 눌리는 것을 방지
      root.addEventListener('click', function(e) {
        if (Date.now() < dragEngine.suppressClickUntil) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    }

    function isDragBlockedTarget(target) {
      return !!target.closest('button, input, select, textarea, a, label');
    }

    function handleDragTouchStart(e) {
      if (e.touches.length !== 1 || isDragBlockedTarget(e.target)) return;

      const card = e.target.closest('.line-card');
      if (!card) return;

      const touch = e.touches[0];
      beginPotentialDrag(card, touch.clientX, touch.clientY, 'touch', touch.identifier);
    }

    function handleDragTouchMove(e) {
      if (!dragEngine.card || dragEngine.inputType !== 'touch') return;

      const touch = Array.from(e.touches).find(t => t.identifier === dragEngine.touchId);
      if (!touch) return;

      const dx = touch.clientX - dragEngine.startX;
      const dy = touch.clientY - dragEngine.startY;

      // 롱프레스가 되기 전에 손가락을 움직이면 일반 스크롤로 처리
      if (!dragEngine.dragging) {
        if (Math.hypot(dx, dy) > 10) cancelPotentialDrag();
        return;
      }

      e.preventDefault();
      moveActiveDrag(touch.clientX, touch.clientY);
    }

    function handleDragTouchEnd(e) {
      if (!dragEngine.card || dragEngine.inputType !== 'touch') return;
      if (dragEngine.dragging) e.preventDefault();
      finishOrCancelDrag();
    }

    function handleDragMouseDown(e) {
      if (e.button !== 0 || isDragBlockedTarget(e.target)) return;

      const card = e.target.closest('.line-card');
      if (!card) return;

      e.preventDefault();
      beginPotentialDrag(card, e.clientX, e.clientY, 'mouse', null);
    }

    function handleDragMouseMove(e) {
      if (!dragEngine.card || dragEngine.inputType !== 'mouse') return;

      const dx = e.clientX - dragEngine.startX;
      const dy = e.clientY - dragEngine.startY;

      if (!dragEngine.dragging) {
        if (Math.hypot(dx, dy) > 8) cancelPotentialDrag();
        return;
      }

      e.preventDefault();
      moveActiveDrag(e.clientX, e.clientY);
    }

    function handleDragMouseUp() {
      if (!dragEngine.card || dragEngine.inputType !== 'mouse') return;
      finishOrCancelDrag();
    }

    function beginPotentialDrag(card, x, y, inputType, touchId) {
      cancelPotentialDrag();

      dragEngine.card = card;
      dragEngine.inputType = inputType;
      dragEngine.touchId = touchId;
      dragEngine.startX = x;
      dragEngine.startY = y;
      dragEngine.currentX = x;
      dragEngine.currentY = y;
      dragEngine.dragging = false;

      // iOS처럼 '꾹 누른 뒤' 뜨도록 약간의 지연
      dragEngine.timer = setTimeout(() => {
        activateDrag();
      }, 230);
    }

    function cancelPotentialDrag() {
      if (dragEngine.timer) {
        clearTimeout(dragEngine.timer);
        dragEngine.timer = null;
      }

      if (!dragEngine.dragging) {
        dragEngine.card = null;
        dragEngine.inputType = null;
        dragEngine.touchId = null;
      }
    }

    function activateDrag() {
      const card = dragEngine.card;
      if (!card) return;

      dragEngine.timer = null;
      dragEngine.dragging = true;
      dragEngine.startRect = card.getBoundingClientRect();

      const clone = card.cloneNode(true);
      clone.classList.remove('drag-placeholder-card');
      clone.classList.add('drag-lifted-card');

      clone.style.left = dragEngine.startRect.left + 'px';
      clone.style.top = dragEngine.startRect.top + 'px';
      clone.style.width = dragEngine.startRect.width + 'px';
      clone.style.height = dragEngine.startRect.height + 'px';

      // 처음 뜨는 순간: 수평을 유지한 채 2.5% 확대
      clone.style.transform = 'translate3d(0, -2px, 0) scale(1.025) rotate(0deg)';

      card.classList.add('drag-placeholder-card');
      document.body.appendChild(clone);

      dragEngine.clone = clone;
      document.body.classList.add('is-card-dragging');

      if (navigator.vibrate) navigator.vibrate(18);
    }

    function moveActiveDrag(x, y) {
      if (!dragEngine.dragging || !dragEngine.clone) return;

      dragEngine.currentX = x;
      dragEngine.currentY = y;

      if (!dragEngine.raf) {
        dragEngine.raf = requestAnimationFrame(updateDragFrame);
      }
    }

    function updateDragFrame() {
      dragEngine.raf = null;
      if (!dragEngine.dragging || !dragEngine.clone || !dragEngine.card) return;

      const dx = dragEngine.currentX - dragEngine.startX;
      const dy = dragEngine.currentY - dragEngine.startY;

      // 이동 + 확대만 적용. 회전값은 항상 0deg.
      dragEngine.clone.style.transform =
        `translate3d(${dx}px, ${dy - 2}px, 0) scale(1.025) rotate(0deg)`;

      reorderPlaceholderAtPoint(dragEngine.currentX, dragEngine.currentY);
      handleDragAutoScroll(dragEngine.currentY);
    }

    function reorderPlaceholderAtPoint(x, y) {
      const card = dragEngine.card;
      if (!card) return;

      const el = document.elementFromPoint(x, y);
      if (!el) return;

      const targetCard = el.closest('.line-card');
      const targetGroup = el.closest('.sortable-group');

      if (targetCard && targetCard !== card) {
        const group = targetCard.closest('.sortable-group');
        if (!group) return;

        const rect = targetCard.getBoundingClientRect();
        const before = y < rect.top + rect.height / 2;

        if (before) {
          group.insertBefore(card, targetCard);
        } else {
          group.insertBefore(card, targetCard.nextSibling);
        }
        return;
      }

      // 카드 사이의 빈 공간이나 그룹 하단으로 이동했을 때
      if (targetGroup && targetCard !== card) {
        const cards = Array.from(targetGroup.querySelectorAll('.line-card'))
          .filter(c => c !== card);

        if (cards.length === 0) {
          targetGroup.appendChild(card);
        } else {
          const last = cards[cards.length - 1];
          const r = last.getBoundingClientRect();
          if (y > r.bottom) targetGroup.appendChild(card);
        }
      }
    }

    function handleDragAutoScroll(y) {
      const edge = 86;
      const speed = 12;

      if (y < edge) {
        window.scrollBy(0, -speed);
      } else if (y > window.innerHeight - edge) {
        window.scrollBy(0, speed);
      }
    }

    function finishOrCancelDrag() {
      if (dragEngine.timer) {
        clearTimeout(dragEngine.timer);
        dragEngine.timer = null;
      }

      if (!dragEngine.dragging) {
        resetDragState();
        return;
      }

      const card = dragEngine.card;
      const clone = dragEngine.clone;

      dragEngine.suppressClickUntil = Date.now() + 350;

      if (card && clone && dragEngine.startRect) {
        const targetRect = card.getBoundingClientRect();
        const targetDx = targetRect.left - dragEngine.startRect.left;
        const targetDy = targetRect.top - dragEngine.startRect.top;

        // 놓는 순간 자리로 스냅. 마지막까지 수평 유지.
        clone.style.transition =
          'transform 160ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 160ms ease';
        clone.style.transform =
          `translate3d(${targetDx}px, ${targetDy}px, 0) scale(1) rotate(0deg)`;
        clone.style.boxShadow =
          '0 4px 12px rgba(15, 23, 42, 0.08)';

        setTimeout(() => {
          if (clone.isConnected) clone.remove();
          if (card) card.classList.remove('drag-placeholder-card');
        }, 165);
      } else {
        if (clone && clone.isConnected) clone.remove();
        if (card) card.classList.remove('drag-placeholder-card');
      }

      document.body.classList.remove('is-card-dragging');
      persistDraggedOrder();
      resetDragState(false);
    }

    function persistDraggedOrder() {
      const allLines = loadData();
      const reordered = [];

      document.querySelectorAll('.sortable-group').forEach(gEl => {
        const currentOwner = gEl.dataset.owner;

        gEl.querySelectorAll('[data-id]').forEach(cardEl => {
          const lineId = parseInt(cardEl.dataset.id);
          const found = allLines.find(l => l.id === lineId);

          if (found) {
            found.owner = currentOwner;
            reordered.push(found);
          }
        });
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(reordered));
    }

    function resetDragState(removeVisuals = true) {
      if (dragEngine.raf) {
        cancelAnimationFrame(dragEngine.raf);
        dragEngine.raf = null;
      }

      if (removeVisuals) {
        if (dragEngine.clone && dragEngine.clone.isConnected) dragEngine.clone.remove();
        if (dragEngine.card) dragEngine.card.classList.remove('drag-placeholder-card');
        document.body.classList.remove('is-card-dragging');
      }

      dragEngine.card = null;
      dragEngine.clone = null;
      dragEngine.timer = null;
      dragEngine.dragging = false;
      dragEngine.inputType = null;
      dragEngine.touchId = null;
      dragEngine.startRect = null;
    }

    function openModal(id = null, prefillData = null) {
      const modal = document.getElementById('edit-modal');
      const form = document.getElementById('line-form');
      form.reset();
      document.getElementById('calc-hint').innerText = '';

      const lines = loadData();
      const slotSelect = document.getElementById('form-target-slot');
      slotSelect.innerHTML = '<option value="new">+ 새 회선으로 추가하기</option>';
      lines.forEach(l => {
        slotSelect.innerHTML += `<option value="${l.id}">기존 [${l.owner}] ${l.name} (${l.phone || '번호없음'}) 덮어쓰기</option>`;
      });

      if (id) {
        slotSelect.value = id;
        const item = lines.find(l => l.id === id);
        if (item) populateForm(item);
        document.getElementById('modal-title').innerText = '회선 정보 수정';
        document.getElementById('btn-delete').classList.remove('hidden');
      } else if (prefillData) {
        let matchedId = 'new';
        if (prefillData.phone) {
          const matched = lines.find(l => l.phone && l.phone.replace(/[^0-9]/g, '').includes(prefillData.phone.replace(/[^0-9]/g, '')));
          if (matched) matchedId = matched.id;
        }
        slotSelect.value = matchedId;
        populateForm(prefillData);
        document.getElementById('modal-title').innerText = 'AI 분석 결과 확인';
        document.getElementById('btn-delete').classList.add('hidden');
      } else {
        slotSelect.value = 'new';
        document.getElementById('line-id').value = '';
        document.getElementById('modal-title').innerText = '새 회선 추가';
        document.getElementById('btn-delete').classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function populateForm(data) {
      document.getElementById('line-id').value = data.id || '';
      if (data.owner) document.getElementById('form-owner').value = data.owner;
      if (data.type) document.getElementById('form-type').value = data.type;
      if (data.name) document.getElementById('form-name').value = data.name;
      
      const phoneInput = document.getElementById('form-phone');
      if (data.phone) {
        phoneInput.value = data.phone;
        formatPhoneInput(phoneInput);
      } else {
        phoneInput.value = '';
      }

      if (data.carrier) {
        const parsed = parseCarrier(data.carrier);
        document.getElementById('form-carrier-name').value = parsed.name;
        document.getElementById('form-carrier-net').value = parsed.net;
      } else {
        document.getElementById('form-carrier-name').value = '';
        document.getElementById('form-carrier-net').value = 'KT망';
      }

      if (data.data) document.getElementById('form-data').value = data.data;
      if (data.call) document.getElementById('form-call').value = data.call;
      if (data.sms) document.getElementById('form-sms').value = data.sms;
      if (data.startDate) document.getElementById('form-start-date').value = data.startDate;
      if (data.duration) document.getElementById('form-duration').value = data.duration;
      if (data.endDate) document.getElementById('form-end-date').value = data.endDate;
      
      const feeInput = document.getElementById('form-fee');
      if (data.fee) {
        const rawNum = data.fee.replace(/[^0-9]/g, '');
        feeInput.value = rawNum ? Number(rawNum).toLocaleString('ko-KR') : '';
      } else {
        feeInput.value = '';
      }

      if (data.startDate && data.duration) calcEndDate();
    }

    function onSlotChange() {
      const selectedSlot = document.getElementById('form-target-slot').value;
      if (selectedSlot !== 'new') {
        const lines = loadData();
        const item = lines.find(l => l.id === parseInt(selectedSlot));
        if (item) {
          document.getElementById('line-id').value = item.id;
          document.getElementById('form-owner').value = item.owner;
          document.getElementById('form-name').value = item.name;
          if (item.phone) {
            const phoneInput = document.getElementById('form-phone');
            phoneInput.value = item.phone;
            formatPhoneInput(phoneInput);
          }
          const parsed = parseCarrier(item.carrier);
          document.getElementById('form-carrier-name').value = parsed.name;
          document.getElementById('form-carrier-net').value = parsed.net;
        }
      } else {
        document.getElementById('line-id').value = '';
      }
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function saveLine(e) {
      e.preventDefault();
      const lines = loadData();
      const slotVal = document.getElementById('form-target-slot').value;
      const targetId = (slotVal !== 'new') ? parseInt(slotVal) : (document.getElementById('line-id').value ? parseInt(document.getElementById('line-id').value) : Date.now());

      const carrierName = document.getElementById('form-carrier-name').value.trim();
      const carrierNet = document.getElementById('form-carrier-net').value;
      const combinedCarrier = carrierName ? `${carrierName} (${carrierNet})` : carrierNet;

      const rawFee = document.getElementById('form-fee').value.replace(/[^0-9]/g, '');
      const finalFee = (rawFee === '' ? '0' : Number(rawFee).toLocaleString('ko-KR')) + '원';

      const lineObj = {
        id: targetId,
        owner: document.getElementById('form-owner').value,
        type: document.getElementById('form-type').value,
        name: document.getElementById('form-name').value,
        phone: document.getElementById('form-phone').value,
        carrier: combinedCarrier,
        data: document.getElementById('form-data').value,
        call: document.getElementById('form-call').value,
        sms: document.getElementById('form-sms').value,
        startDate: document.getElementById('form-start-date').value,
        duration: document.getElementById('form-duration').value,
        endDate: document.getElementById('form-end-date').value,
        fee: finalFee
      };

      const idx = lines.findIndex(l => l.id === targetId);
      if (idx !== -1) {
        lines[idx] = lineObj;
      } else {
        lines.push(lineObj);
      }

      saveData(lines);
      closeModal();
    }

    function deleteLine() {
      const idVal = document.getElementById('line-id').value;
      if (idVal && confirm('이 회선을 삭제하시겠습니까?')) {
        let lines = loadData();
        lines = lines.filter(l => l.id !== parseInt(idVal));
        saveData(lines);
        closeModal();
      }
    }

    function editLine(id) {
      openModal(id);
    }

    function openVoiceModal() {
      document.getElementById('voice-text-input').value = '';

    async function processVoiceText() {
      const text = document.getElementById('voice-text-input').value.trim();
      if (!text) {
        alert('내용을 입력하거나 마이크로 말해주세요.');

      const apiKey = localStorage.getItem(API_KEY_STORAGE);

      }

      closeVoiceModal();
      document.getElementById('loading-msg').innerText = '자연어 내용을 분석 중입니다...';
      document.getElementById('loading-overlay').classList.remove('hidden');

      try {
        const promptText = `
사용자가 구어체로 말하거나 자유롭게 작성한 알뜰폰 개통/가입 정보입니다.
아래 문장에서 회선 정보를 추출하여 반드시 정해진 JSON 형식으로만 응답하세요.
모르는 항목은 빈 문자열("")로 채우세요.
날짜는 반드시 YYYY-MM-DD 형식이어야 합니다.
할인 기간(개월) 숫자를 추출해주세요 (예: 6개월 할인이면 "6").

[사용자 입력 내용]
"${text}"

JSON 출력 포맷:
{
  "owner": "명의자 성함 (있으면)",
  "phone": "전화번호 (예: 010-1234-5678)",
  "type": "USIM 또는 eSIM",
  "name": "회선 별칭 (예: 1. main, 네비용 등)",
  "carrier": "통신사명 및 망 (예: 프리티 KT망, 모비링 SKT망)",
  "data": "데이터 제공량 (예: 15GB+1Mbps, 500MB)",
  "call": "통화량 (예: 무제한, 100분)",
  "sms": "문자량 (예: 100건, 무제한)",
  "startDate": "개통일 (YYYY-MM-DD)",
  "duration": "할인개월수 (숫자만, 예: 6)",
  "endDate": "할인종료일 (YYYY-MM-DD)",
  "fee": "할인 요금 (예: 0원, 1,100원)"
}
`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const result = await response.json();
        if (result.error) throw new Error(result.error.message);

        const parsedJson = JSON.parse(result.candidates[0].content.parts[0].text);
        openModal(null, parsedJson);

      } catch (err) {
        alert('분석 중 오류가 발생했습니다: ' + err.message);
      } finally {
        document.getElementById('loading-overlay').classList.add('hidden');

    }

    async function processScreenshot(event) {
      const file = event.target.files[0];
      if (!file) return;

      const apiKey = localStorage.getItem(API_KEY_STORAGE);
      if (!apiKey) {
        alert('먼저 상단의 [🔑 API] 버튼을 눌러 발급받은 Gemini API 키를 등록해 주세요.');
        openApiKeyModal();
        event.target.value = '';
        return;
      }

      document.getElementById('loading-msg').innerText = '스크린샷 이미지를 분석 중입니다...';
      document.getElementById('loading-overlay').classList.remove('hidden');

      try {
        const base64Data = await fileToBase64(file);
        const promptText = `
이 스크린샷은 알뜰폰 요금제 또는 가입 내역 화면입니다.
아래 JSON 형식에 맞춰 필요한 정보를 추출해주세요.
알 수 없는 항목은 빈 문자열로 두세요.
날짜는 반드시 YYYY-MM-DD 형식이어야 합니다.
할인 기간(개월) 숫자를 추출해주세요 (예: 6개월 할인이면 6).

JSON 출력 포맷:
{
  "owner": "명의자 성함 (있으면)",
  "phone": "전화번호 (예: 010-1234-5678)",
  "type": "USIM 또는 eSIM",
  "name": "회선 별칭",
  "carrier": "통신사명 및 망 (예: 프리티 KT망)",
  "data": "데이터 제공량 (예: 15GB+1Mbps)",
  "call": "통화량 (예: 무제한)",
  "sms": "문자량 (예: 100건)",
  "startDate": "개통일 (YYYY-MM-DD)",
  "duration": "할인개월수 (숫자만, 예: 6)",
  "endDate": "할인종료일 (YYYY-MM-DD, 명시되어 있다면)",
  "fee": "할인 요금 (예: 0원 또는 1,100원)"
}
`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inline_data: {
                    mime_type: file.type || 'image/png',
                    data: base64Data.split(',')[1]
                  }
                }
              ]
            }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const result = await response.json();
        if (result.error) throw new Error(result.error.message);

        const parsedJson = JSON.parse(result.candidates[0].content.parts[0].text);
        openModal(null, parsedJson);

      } catch (err) {
        alert('분석 중 오류가 발생했습니다: ' + err.message);
      } finally {
        document.getElementById('loading-overlay').classList.add('hidden');
        event.target.value = '';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function openApiKeyModal() {
      document.getElementById('gemini-api-key-input').value = localStorage.getItem(API_KEY_STORAGE) || '';
      document.getElementById('api-modal').classList.remove('hidden');
    }

    function closeApiKeyModal() {
      document.getElementById('api-modal').classList.add('hidden');

      const key = document.getElementById('gemini-api-key-input').value.trim();
      if (key) {
        localStorage.setItem(API_KEY_STORAGE, key);
        alert('Gemini API 키가 저장되었습니다.');
        closeApiKeyModal();

    function sendEmailBackup() {
      const lines = loadData();
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const dataStr = JSON.stringify(lines, null, 2);

      let summaryText = lines.map((l, i) => `${i+1}. [${l.owner}] ${l.name} (${l.carrier}) - 만료일: ${l.endDate} / 요금: ${l.fee}`).join('\n');

      const subject = encodeURIComponent(`[알뜰폰 회선 매니저] 백업 데이터 (${dateStr})`);

        `알뜰폰 회선 매니저 데이터 백업 파일입니다.\n\n` +
        `[회선 요약 목록]\n${summaryText}\n\n` +
        `-----------------------------------------\n` +

        `아래 JSON 코드를 복사하여 앱의 [백업] -> [데이터 적용]에 넣으시면 복원됩니다:\n\n` +
        `${dataStr}`
      );

      window.location.href = `mailto:dong8279@naver.com?subject=${subject}&body=${body}`;
    }

    function downloadBackupFile() {
      const lines = loadData();
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const dataStr = JSON.stringify(lines, null, 2);

      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mvno_backup_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function restoreFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed)) {
            saveData(parsed);
            closeJsonModal();
            alert('백업 파일로부터 회선 데이터가 성공적으로 복원되었습니다.');
          } else {
            alert('올바른 백업 파일 형식이 아닙니다.');
          }
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다: ' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function applyJsonData() {
      try {
        const parsed = JSON.parse(document.getElementById('json-input').value);
        if (Array.isArray(parsed)) {
          saveData(parsed);
          closeJsonModal();
          alert('성공적으로 적용되었습니다.');
        } else {
          alert('데이터 형식이 올바르지 않습니다.');
        }
      } catch (err) {
        alert('JSON 형식이 잘못되었습니다.');
      }
    }

    render();
